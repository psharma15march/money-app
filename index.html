<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Quick Budget</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--tx:#14181a;--mu:#66727a;--bd:#e3e8e6;--ac:#0f766e;--up:#16a34a;--dn:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1112;--card:#181c1e;--tx:#eef2f1;--mu:#93a0a6;--bd:#273033;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0e1112;--card:#181c1e;--tx:#eef2f1;--mu:#93a0a6;--bd:#273033;--ac:#2dd4bf}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:13px;color:var(--mu);margin:20px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
small{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;border:0}.hero small{color:#ffffffbb}.hero b{font-size:34px;display:block;margin:2px 0}
.hero svg{margin-top:6px}
.k{font-size:20px;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;border-radius:99px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 11px;min-width:0;width:100%}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.f .w{grid-column:span 2}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;margin-bottom:6px}.chip{flex:1;font:inherit;font-size:13px;padding:8px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.mini{width:110px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:9px 0 7px;cursor:pointer}nav button b{display:block;font-size:19px}nav .on{color:var(--ac);font-weight:700}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const KEY='sam-fin-v1',PAL=['#0f766e','#6366f1','#f59e0b','#ec4899','#0ea5e9','#84cc16','#f97316','#a855f7'];
const EXC=['Housing','Groceries','Dining','Transport','Bills','Utilities','Subscriptions','Shopping','Health','Insurance','Personal','Fun','Other'],INC=['Salary','Business','Dividends','Rent','Other'];
const NEEDS=['Housing','Groceries','Transport','Bills','Utilities','Insurance','Health'],WANTS=['Dining','Subscriptions','Shopping','Personal','Fun'];
const RULES=[[/tim hortons|starbucks|mcdonald|burger|pizza|sushi|restaurant|cafe|coffee|a&w|subway|skip ?the ?dishes|doordash|uber ?eats|fantuan/i,'Dining'],[/save-on|superstore|loblaws|sobeys|safeway|freshco|no frills|t&t|grocery|groceries|costco|walmart|market/i,'Groceries'],[/netflix|spotify|apple|icloud|google one|youtube premium|prime|disney|hulu|subscription|membership|gym|goodlife/i,'Subscriptions'],[/bc hydro|fortis|hydro|electric|water bill|telus|rogers|bell|fido|koodo|internet|phone bill|shaw/i,'Utilities'],[/shell|petro|esso|chevron|gas station|translink|compass|uber(?! eats)|lyft|taxi|parking|icbc/i,'Transport'],[/insurance|icbc insurance/i,'Insurance'],[/pharmacy|shoppers drug|dental|dentist|clinic|doctor|physiotherapy/i,'Health'],[/amazon|ikea|best buy|canadian tire|dollarama|winners|mall|store/i,'Shopping'],[/rent|mortgage|landlord|strata/i,'Housing']];
let S,view='home',dq=null,ex='expense',q='',mf='';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.acc)S={n:1,cur:'CAD',acc:[],hold:[],tx:[],snap:{}};
if(!S.bud)S.bud={};if(!S.rec)S.rec=[];if(!S.goals)S.goals=[];if(!S.mkt)S.mkt={last:null,news:[]};if(!S.learn)S.learn={};if(S.lastBackup===undefined)S.lastBackup=null;if(S.theme===undefined)S.theme='';if(S.theme)document.documentElement.dataset.theme=S.theme;
const num=v=>parseFloat(v)||0,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const tdy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const A=id=>S.acc.find(a=>a.id==id),T={cash:'Chequing / cash',savings:'Savings',credit:'Credit card',tfsa:'TFSA',fhsa:'FHSA',rrsp:'RRSP / Pension',invest:'Non-registered / Investing'};
const cash=()=>sum(S.acc.filter(a=>a.t=='cash'),a=>a.b),sav=()=>sum(S.acc.filter(a=>a.t=='savings'),a=>a.b),debt=()=>sum(S.acc.filter(a=>a.t=='credit'),a=>a.b),invAcc=()=>sum(S.acc.filter(a=>['tfsa','fhsa','rrsp','invest'].includes(a.t)),a=>a.b),inv=()=>sum(S.hold,h=>h.sh*h.px)+invAcc(),nw=()=>cash()+sav()+inv()-debt();
const save=()=>{if(S.acc.length||S.hold.length)S.snap[tdy()]=Math.round(nw()*100)/100;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fm=(n,d)=>new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur,maximumFractionDigits:d}).format(n),f0=n=>fm(n,0),f2=n=>fm(n,2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=(m,k)=>sum(S.tx.filter(t=>t.k==k&&t.d.slice(0,7)==m),t=>t.a);
function ap(t,s){const a=A(t.acc);if(!a)return;if(t.k=='income')a.b+=s*t.a;else if(t.k=='expense')a.b+=a.t=='credit'?s*t.a:-s*t.a;else{const c=A(t.card);if(c)c.b-=s*t.a;a.b-=s*t.a}}
function line(){const k=Object.keys(S.snap).sort().slice(-90),v=k.map(x=>S.snap[x]);if(v.length<2)return '<small>Your net worth chart fills in as you use the app on different days.</small>';
const w=320,h=110,mn=Math.min(...v),r=(Math.max(...v)-mn)||1,d=v.map((y,i)=>(i?'L':'M')+(i/(v.length-1)*w).toFixed(1)+' '+(h-8-(y-mn)/r*(h-22)).toFixed(1)).join('');
return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function donut(it){it=it.filter(i=>i.v>0);const t=sum(it,i=>i.v);if(t<=0)return '<small>Nothing to show yet.</small>';const r=48,L=2*Math.PI*r;let o=0;
const arcs=it.map((i,k)=>{const l=i.v/t*L,s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${PAL[k%8]}" stroke-width="18" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('');
return `<div class="row"><svg width="130" height="130" viewBox="0 0 120 120">${arcs}</svg><div class="sp">${it.map((i,k)=>`<div class="lg"><i style="background:${PAL[k%8]}"></i><span>${esc(i.n)}</span><b>${Math.round(i.v/t*100)}%</b></div>`).join('')}</div></div>`}
function mbars(){const D=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=ym(d);D.push({m,d,i:tot(m,'income'),e:tot(m,'expense')})}
const mx=Math.max(1,...D.flatMap(x=>[x.i,x.e]));
return `<svg viewBox="0 0 320 125" width="100%">${D.map((x,k)=>{const g=k*53+8,hi=x.i/mx*88,he=x.e/mx*88;return `<rect x="${g}" y="${98-hi}" width="18" height="${hi}" rx="4" fill="var(--up)"/><rect x="${g+21}" y="${98-he}" width="18" height="${he}" rx="4" fill="var(--dn)"/><text x="${g+20}" y="116" text-anchor="middle" font-size="10" fill="var(--mu)">${x.d.toLocaleDateString(undefined,{month:'short'})}</text>`}).join('')}</svg><div class="lg"><i style="background:var(--up)"></i><span>Income</span><i style="background:var(--dn)"></i><span>Expenses</span></div>`}
function home(){
 if(!S.acc.length&&!S.hold.length)return `<h1>Quick Budget</h1><div class="card"><b>Start here</b><p style="color:var(--mu);font-size:14px;line-height:1.5">1. Accounts tab: add your chequing, savings and credit cards with today’s balances.<br>2. Invest tab: add your stocks with shares, price and dividend.<br>3. Activity tab: log income, spending and card payments — recurring salary and bills post themselves there.<br>Your net worth and charts build from that.</p><button class="btn g" onclick="seedTest()">${dq=='seed'?'Tap again — load TEST data (replaces current)':'Load test data to explore'}</button></div>`;
 const n=nw(),m=ym(new Date()),inc=tot(m,'income'),exp=tot(m,'expense'),sr=inc>0?Math.round((inc-exp)/inc*100):null,ks=Object.keys(S.snap).sort(),bk=ks[Math.max(0,ks.length-31)],dl=ks.length>1?n-S.snap[bk]:null;
 const cats={};S.tx.filter(t=>t.k=='expense'&&t.d.slice(0,7)==m).forEach(t=>cats[t.c]=(cats[t.c]||0)+t.a);const cs=Object.entries(cats).sort((a,b)=>b[1]-a[1]),cm=cs.length?cs[0][1]:1;
 const cards=S.acc.filter(a=>a.t=='credit'&&a.lim>0),dv=sum(S.hold,h=>h.sh*h.div);
 return `<h1>Quick Budget</h1><div class="card hero"><small>NET WORTH</small><b>${f0(n)}</b><small>${dl==null?'Tracking starts today':(dl>=0?'▲ ':'▼ ')+f0(Math.abs(dl))+' since '+bk}</small>${line()}</div>`+annCard()+
 `<div class="g2"><div class="card"><small>Assets</small><div class="k up">${f0(cash()+sav()+inv())}</div></div><div class="card"><small>Debt</small><div class="k dn">${f0(-debt())}</div></div></div>`+lockCard()+
 `<h2>Where your money sits</h2><div class="card">${donut([{n:'Cash',v:cash()},{n:'Savings',v:sav()},{n:'Investments',v:inv()}])}</div>`+
 `<h2>This month</h2><div class="g2"><div class="card"><small>Income</small><div class="k up">${f0(inc)}</div></div><div class="card"><small>Spent</small><div class="k dn">${f0(exp)}</div></div></div><div class="card"><div class="row"><small class="sp">Savings rate</small><b class="${sr!=null&&sr<0?'dn':'up'}">${sr==null?'–':sr+'%'}</b></div></div>`+
 `<div class="card">${mbars()}</div>`+
 (cs.length?`<h2>Spending by category</h2><div class="card">${cs.map(([c,v],i)=>`<div class="row"><small class="sp">${esc(c)}</small><b style="font-size:13px">${f0(v)}</b></div><div class="bar"><i style="width:${v/cm*100}%;background:${PAL[i%8]}"></i></div>`).join('')}</div>`:'')+
 (cards.length?`<h2>Credit utilization</h2><div class="card">${cards.map(a=>{const u=a.b/a.lim*100;return `<div class="row"><small class="sp">${esc(a.n)}</small><b style="font-size:13px" class="${u>30?'dn':'up'}">${Math.round(u)}%</b></div><div class="bar"><i style="width:${Math.min(100,u)}%;background:${u>30?'var(--dn)':'var(--up)'}"></i></div>`}).join('')}<small>Under 30% is the usual target.</small></div>`:'')+
 (dv>0?`<h2>Dividends</h2><div class="g2"><div class="card"><small>Per year</small><div class="k">${f0(dv)}</div></div><div class="card"><small>Per month</small><div class="k">${f0(dv/12)}</div></div></div>`:'')+budgetCard(m)+insights()}
function accts(){
 let h=`<h1>Accounts</h1>`;
 Object.keys(T).forEach(t=>{const L=S.acc.filter(a=>a.t==t);if(!L.length)return;h+=`<h2>${T[t]} · ${f0(sum(L,a=>a.b))}</h2><div class="card">`+L.map(a=>`<div class="li"><div class="sp"><b>${esc(a.n)}</b>${a.lim?`<br><small>Limit ${f0(a.lim)}</small>`:''}</div><input class="mini" type="number" inputmode="decimal" value="${a.b}" onchange="setA(${a.id},this.value)"><button class="x" onclick="delA(${a.id})">${dq=='a'+a.id?'Sure?':'×'}</button></div>`).join('')+`</div>`});
 return h+`<h2>Add account</h2><div class="card"><div class="f"><input id="an" class="w" placeholder="Name (e.g. RBC Visa)"><select id="at">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="ab" type="number" inputmode="decimal" placeholder="Balance (owed, for cards)"><input id="al" class="w" type="number" inputmode="decimal" placeholder="Credit limit (cards only, optional)"><button class="btn w" onclick="addA()">Add account</button></div></div>`}
function invest(){
 const v=inv(),c=sum(S.hold,h=>h.sh*h.cost),dv=sum(S.hold,h=>h.sh*h.div),g=v-c;
 let h=`<h1>Investing</h1><div class="card hero"><small>PORTFOLIO VALUE</small><b>${f0(v)}</b><small>${g>=0?'▲ ':'▼ '}${f0(Math.abs(g))} (${c>0?(g/c*100).toFixed(1):0}%) vs cost</small></div>`;
 h+=`<div class="card"><small id="mktstatus">${S.mkt.last?'Last updated '+esc(S.mkt.last):'Tap update for live delayed prices'} · Free market feed, works online; last prices stay saved offline.</small><br><button class="btn" style="margin-top:8px" onclick="refreshMarket(true)">↻ Update prices &amp; dividends</button></div>`;
 if(S.hold.length)h+=`<div class="card">${donut(S.hold.map(x=>({n:x.tk,v:x.sh*x.px})))}</div><div class="g2"><div class="card"><small>Dividends / year</small><div class="k">${f0(dv)}</div></div><div class="card"><small>Yield on value</small><div class="k">${v>0?(dv/v*100).toFixed(2):0}%</div></div></div><h2>Holdings</h2>`+S.hold.map(x=>{const gl=x.sh*(x.px-x.cost);return `<div class="card"><div class="row"><b class="sp">${esc(x.tk)}</b><b>${f0(x.sh*x.px)}</b><button class="x" onclick="delH(${x.id})">${dq=='h'+x.id?'Sure?':'×'}</button></div><small class="${gl>=0?'up':'dn'}">${gl>=0?'▲':'▼'} ${f0(Math.abs(gl))} · yield ${x.px>0?(x.div/x.px*100).toFixed(2):0}%</small>${x.lastDiv?`<br><small>Latest distribution ${f2(x.lastDiv.amt)}/share · ex-date ${esc(x.lastDiv.date)}${x.cur?' · '+esc(x.cur):''}</small>`:''}<div class="f"><div><small>Shares</small><input type="number" inputmode="decimal" value="${x.sh}" onchange="setH(${x.id},'sh',this.value)"></div><div><small>Price now</small><input type="number" inputmode="decimal" value="${x.px}" onchange="setH(${x.id},'px',this.value)"></div><div><small>Avg cost</small><input type="number" inputmode="decimal" value="${x.cost}" onchange="setH(${x.id},'cost',this.value)"></div><div><small>Div / share / yr</small><input type="number" inputmode="decimal" value="${x.div}" onchange="setH(${x.id},'div',this.value)"></div></div></div>`}).join('');
 return h+`<h2>Add stock</h2><div class="card"><div class="f"><input id="ht" placeholder="Ticker (e.g. MSTE.TO, NVDA)"><input id="hs" type="number" inputmode="decimal" placeholder="Shares"><input id="hc" type="number" inputmode="decimal" placeholder="Avg cost / share"><input id="hp" type="number" inputmode="decimal" placeholder="Price now"><input id="hd" class="w" type="number" inputmode="decimal" placeholder="Dividend per share per year"><button class="btn w" onclick="addH()">Add stock</button></div><small>Prices are manual, or tap Update above — free delayed prices and trailing-12-month dividends fill in. Add .TO for Toronto listings.</small></div>`}
function activity(){
 const k=['expense','income','payment'],cs=ex=='income'?INC:EXC,nc=S.acc.filter(a=>a.t!='credit'),cc=S.acc.filter(a=>a.t=='credit'),pool=ex=='expense'?S.acc:nc;
 const o=a=>`<option value="${a.id}">${esc(a.n)}</option>`;
 let h=`<h1>Activity</h1><div class="card"><div class="chips">${k.map(x=>`<button class="chip ${x==ex?'on':''}" onclick="ex='${x}';render()">${x}</button>`).join('')}</div><div class="f"><input id="xa" type="number" inputmode="decimal" placeholder="Amount"><input id="xd" type="date" value="${tdy()}">${ex!='payment'?`<select id="xc">${cs.map(c=>`<option>${c}</option>`).join('')}</select>`:`<select id="xk">${cc.map(o).join('')}</select>`}<select id="xt">${pool.map(o).join('')}</select><input id="xn" class="w" placeholder="Note / store name — category fills itself" oninput="autoCat()"><button class="btn w" onclick="addX()">Add ${ex}</button></div>${S.acc.length?'':'<small>Add an account first.</small>'}</div><h2>Recent</h2><div class="card"><div class="f" style="margin-top:0"><input placeholder="Search note or category…" value="${esc(q)}" oninput="q=this.value;render()"><input type="month" value="${mf}" onchange="mf=this.value;render()"></div>`;
 h+=`<h2>Recurring — posts itself when due</h2><div class="card">`+(S.rec.length?S.rec.map(r=>`<div class="li"><div class="sp"><b>${esc(r.n)}</b><br><small>${esc(r.freq)} · next ${esc(r.next)} · ${esc(r.c)}</small></div><b>${f2(r.a)}</b><button class="x" onclick="delR(${r.id})">${dq=='r'+r.id?'Sure?':'×'}</button></div>`).join(''):'<small>No recurring yet — add your bi-weekly salary and monthly bills once.</small>')+`<div class="f"><input id="rn" class="w" placeholder="Name (e.g. Salary, Rent)"><input id="ra" type="number" inputmode="decimal" placeholder="Amount"><select id="rk"><option value="income">Income</option><option value="expense">Expense</option></select><select id="rf"><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select><input id="rd" type="date" value="${tdy()}"><select id="rc">${EXC.concat(INC).map(c=>`<option>${c}</option>`).join('')}</select><select id="rt">${S.acc.map(a=>`<option value="${a.id}">${esc(a.n)}</option>`).join('')}</select><button class="btn w" onclick="addR()">Add recurring</button></div></div>`;
 const L=S.tx.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).filter(t=>!q||(t.c+' '+(t.n||'')).toLowerCase().includes(q.toLowerCase())).filter(t=>!mf||t.d.slice(0,7)==mf).slice(0,60);
 h+=L.length?L.map(t=>`<div class="li"><div class="sp"><b>${esc(t.c)}</b>${t.n?' · '+esc(t.n):''}<br><small>${t.d} · ${esc((A(t.acc)||{n:'deleted'}).n)}</small></div><b class="${t.k=='income'?'up':t.k=='expense'?'dn':''}">${t.k=='income'?'+':t.k=='expense'?'−':''}${f2(t.a)}</b><button class="x" onclick="delX(${t.id})">${dq=='x'+t.id?'Sure?':'×'}</button></div>`).join(''):'<small>No entries yet.</small>';
 return h+'</div>'}
function more(){return `<h1>More</h1><div class="card"><small>Currency</small><select onchange="S.cur=this.value;save();render()">${['CAD','USD','EUR','GBP','INR','AUD'].map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select></div><div class="card"><small>Appearance</small><select onchange="S.theme=this.value;document.documentElement.dataset.theme=this.value;save()"><option value="" ${!S.theme?'selected':''}>System</option><option value="light" ${S.theme=='light'?'selected':''}>Light</option><option value="dark" ${S.theme=='dark'?'selected':''}>Dark</option></select></div><h2>Goals</h2><div class="card">${S.goals.length?S.goals.map(g=>`<div class="li"><div class="sp"><b>${esc(g.name)}</b><br><small>${f0(g.saved)} of ${f0(g.target)}${g.date?' · by '+esc(g.date):''}</small></div><input class="mini" type="number" value="${g.saved}" onchange="setG(${g.id},this.value)"><button class="x" onclick="delG(${g.id})">${dq=='g'+g.id?'Sure?':'×'}</button></div>`).join(''):'<small>No goals yet — e.g. Emergency fund, First home.</small>'}<div class="f"><input id="gn" class="w" placeholder="Goal name"><input id="gt" type="number" placeholder="Target $"><input id="gs" type="number" placeholder="Saved so far $"><input id="gd" type="date"><button class="btn w" onclick="addG()">Add goal</button></div></div><h2>Import from screenshot</h2><div class="card"><small>Pick a screenshot of holdings, balances, or expenses. It is scanned on this phone (free; first scan downloads the scanner, needs internet once). You review and fix every number before anything is saved — nothing applies automatically.</small><label class="btn g" style="text-align:center;cursor:pointer;display:block;margin-top:8px">Choose screenshot<input type="file" accept="image/*" hidden onchange="scanShot(this)"></label><div id="scanstatus" style="margin-top:8px"><small>No screenshot chosen yet.</small></div><div id="scanreview"></div></div><div class="card row"><button class="btn g sp" onclick="exp()">Exp    if(acctM&&money.length){const map={TFSA:'tfsa',FHSA:'fhsa',RRSP:'rrsp',RESP:'savings',CHEQUING:'cash',CHECKING:'cash',SAVINGS:'savings',CASH:'cash','NON-REGISTERED':'invest'};rows.push({type:'account',name:acctM[1].toUpperCase()+' (from screenshot)',t:map[acctM[1].toUpperCase()]||'cash',b:money[money.length-1],src:ln});return}

 });
