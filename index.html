<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">

<title>Quick Budget</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--tx:#14181a;--mu:#66727a;--bd:#e3e8e6;--ac:#0f766e;--up:#16a34a;--dn:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1112;--card:#181c1e;--tx:#eef2f1;--mu:#93a0a6;--bd:#273033;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0e1112;--card:#181c1e;--tx:#eef2f1;--mu:#93a0a6;--bd:#273033;--ac:#2dd4bf}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:13px;color:var(--mu);margin:20px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
small{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;border:0}.hero small{color:#ffffffbb}.hero b{font-size:34px;display:block;margin:2px 0}
.hero svg{margin-top:6px}
.k{font-size:20px;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;border-radius:99px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 11px;min-width:0;width:100%}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.f .w{grid-column:span 2}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;margin-bottom:6px}.chip{flex:1;font:inherit;font-size:13px;padding:8px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.mini{width:110px;text-align:right;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:9px 0 7px;cursor:pointer}nav button b{display:block;font-size:19px}nav .on{color:var(--ac);font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
@media(max-width:380px){.g3{grid-template-columns:repeat(2,1fr)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:14px;padding:9px 11px}
.tile .tn{font-size:13px;font-weight:700}
.tile .tt{font-size:11.5px;color:var(--mu)}
.ic{width:30px;height:30px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.balin{font-size:19px;font-weight:700;border:0;background:transparent;color:inherit;width:100%;padding:2px 0;font-family:inherit}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bd);margin:5px 0}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills .chip{white-space:nowrap;cursor:default}
.daybars{display:flex;align-items:flex-end;gap:3px;height:78px;margin-top:6px}
.daybars i{flex:1;margin:0 26%;border-radius:3px 3px 0 0;display:block}
.daylbl{display:flex;gap:3px;margin-top:3px}
.daylbl span{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.dhead{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:12px 0 2px}
.addbar{cursor:pointer;color:var(--ac);font-weight:700;font-size:14px}

.k{font-size:23px}
.tile .ic{width:44px;height:44px;font-size:21px}
.tile b{font-size:15px}
.balin{font-size:25px}
.split{height:13px}
.dhead{font-size:12px}
.actrows .ic{width:44px;height:44px;font-size:20px}
.actrows .li b{font-size:16px}
.actrows .amt{font-size:17px}
.pills .chip{font-size:14px;padding:9px 14px}
.chips .chip{font-size:14px;padding:10px 8px}
.addbar{font-size:16px}
.bigf small{font-size:13px}
.bigf input{padding:13px 12px;font-size:17px}
.dn{width:132px;height:132px}

main{padding:16px 14px 94px}
h2{margin:20px 2px 9px}
.card{padding:16px}
.li{padding:11px 0}
.mrow{display:flex;align-items:center;gap:12px;cursor:pointer}
.mrow .ic{width:40px;height:40px;font-size:19px}
.mrow b{font-size:15px}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}
@media (min-width:900px){main{padding-top:24px}}

.catrow{margin-bottom:13px}
.catrow:last-child{margin-bottom:0}
.bar{height:9px}
.k{font-size:25px}
.lg{font-size:14.5px}

.g2,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0}
.k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body{overflow-x:hidden}
.actrows .sp{min-width:0}
.actrows .li b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const KEY=new URLSearchParams(location.search||'').has('demo')?'sam-fin-demo-v1':'sam-fin-v1',PAL=['#0f766e','#6366f1','#f59e0b','#ec4899','#0ea5e9','#84cc16','#f97316','#a855f7'];
const EXC=['Housing','Groceries','Dining','Transport','Bills','Utilities','Subscriptions','Shopping','Health','Insurance','Personal','Fun','Other'],INC=['Salary','Business','Dividends','Rent','Other'];
const NEEDS=['Housing','Groceries','Transport','Bills','Utilities','Insurance','Health'],WANTS=['Dining','Subscriptions','Shopping','Personal','Fun'];
const RULES=[[/tim hortons|starbucks|mcdonald|burger|pizza|sushi|restaurant|cafe|coffee|a&w|subway|skip ?the ?dishes|doordash|uber ?eats|fantuan/i,'Dining'],[/save-on|superstore|loblaws|sobeys|safeway|freshco|no frills|t&t|grocery|groceries|costco|walmart|market/i,'Groceries'],[/netflix|spotify|apple|icloud|google one|youtube premium|prime|disney|hulu|subscription|membership|gym|goodlife/i,'Subscriptions'],[/bc hydro|fortis|hydro|electric|water bill|telus|rogers|bell|fido|koodo|internet|phone bill|shaw/i,'Utilities'],[/shell|petro|esso|chevron|gas station|translink|compass|uber(?! eats)|lyft|taxi|parking|icbc/i,'Transport'],[/insurance|icbc insurance/i,'Insurance'],[/pharmacy|shoppers drug|dental|dentist|clinic|doctor|physiotherapy/i,'Health'],[/amazon|ikea|best buy|canadian tire|dollarama|winners|mall|store/i,'Shopping'],[/rent|mortgage|landlord|strata/i,'Housing']];
let S,view='home',dq=null,ex='expense',q='',mf='',flt='all',ui={};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.acc)S={n:1,cur:'CAD',acc:[],hold:[],tx:[],snap:{}};
if(!S.bud)S.bud={};if(!S.rec)S.rec=[];if(!S.goals)S.goals=[];if(!S.mkt)S.mkt={last:null,news:[]};if(!S.learn)S.learn={};S.hold.forEach(x=>{if(!x.w)x.w='nonreg'});if(S.lastBackup===undefined)S.lastBackup=null;if(S.theme===undefined)S.theme='';if(S.theme)document.documentElement.dataset.theme=S.theme;
const num=v=>parseFloat(v)||0,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const tdy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const A=id=>S.acc.find(a=>a.id==id),T={cash:'Chequing / cash',savings:'Savings',credit:'Credit card',tfsa:'TFSA',fhsa:'FHSA',rrsp:'RRSP / Pension',resp:'RESP',invest:'Non-registered / Investing'};
const cash=()=>sum(S.acc.filter(a=>a.t=='cash'),a=>a.b),sav=()=>sum(S.acc.filter(a=>a.t=='savings'),a=>a.b),debt=()=>sum(S.acc.filter(a=>a.t=='credit'),a=>a.b),invAcc=()=>sum(S.acc.filter(a=>['tfsa','fhsa','rrsp','resp','invest'].includes(a.t)),a=>a.b),inv=()=>sum(S.hold,h=>h.sh*h.px)+invAcc(),nw=()=>cash()+sav()+inv()-debt();
const save=()=>{if(S.acc.length||S.hold.length)S.snap[tdy()]=Math.round(nw()*100)/100;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fm=(n,d)=>new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur,maximumFractionDigits:d}).format(n),f0=n=>fm(n,0),f2=n=>fm(n,2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=(m,k)=>sum(S.tx.filter(t=>t.k==k&&t.d.slice(0,7)==m),t=>t.a);
function ap(t,s){const a=A(t.acc);if(!a)return;if(t.k=='income')a.b+=s*t.a;else if(t.k=='expense')a.b+=a.t=='credit'?s*t.a:-s*t.a;else{const c=A(t.card);if(c)c.b-=s*t.a;a.b-=s*t.a}}
function line(){const k=Object.keys(S.snap).sort().slice(-90),v=k.map(x=>S.snap[x]);if(v.length<2)return '<small>Your net worth chart fills in as you use the app on different days.</small>';
const w=320,h=110,mn=Math.min(...v),r=(Math.max(...v)-mn)||1,d=v.map((y,i)=>(i?'L':'M')+(i/(v.length-1)*w).toFixed(1)+' '+(h-8-(y-mn)/r*(h-22)).toFixed(1)).join('');
return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function donut(it){it=it.filter(i=>i.v>0);const t=sum(it,i=>i.v);if(t<=0)return '<small>Nothing to show yet.</small>';const r=48,L=2*Math.PI*r;let o=0;
const arcs=it.map((i,k)=>{const l=i.v/t*L,s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${PAL[k%8]}" stroke-width="18" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('');
return `<div class="row"><svg width="130" height="130" viewBox="0 0 120 120">${arcs}</svg><div class="sp">${it.map((i,k)=>`<div class="lg"><i style="background:${PAL[k%8]}"></i><span>${esc(i.n)}</span><b>${Math.round(i.v/t*100)}%</b></div>`).join('')}</div></div>`}
function mbars(){const D=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=ym(d);D.push({m,d,i:tot(m,'income'),e:tot(m,'expense')})}
const mx=Math.max(1,...D.flatMap(x=>[x.i,x.e]));
return `<div style="display:flex;align-items:flex-end;gap:6px;height:118px;padding:0 2px">${D.map(x=>`<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%"><div style="width:38%;max-width:30px;height:${Math.max(3,x.i/mx*100)}%;background:var(--up);border-radius:6px 6px 3px 3px"></div><div style="width:38%;max-width:30px;height:${Math.max(3,x.e/mx*100)}%;background:var(--dn);border-radius:6px 6px 3px 3px"></div></div>`).join('')}</div><div style="display:flex;gap:6px;padding:0 2px">${D.map(x=>`<div style="flex:1;text-align:center;font-size:11.5px;color:var(--mu);margin-top:5px">${x.d.toLocaleDateString(undefined,{month:'short'})}</div>`).join('')}</div><div class="lg"><i style="background:var(--up)"></i><span>Income</span><i style="background:var(--dn)"></i><span>Expenses</span></div>`}
function home(){
 if(!S.acc.length&&!S.hold.length)return `<h1>Quick Budget</h1><div class="card"><b>Start here</b><p style="color:var(--mu);font-size:14px;line-height:1.5">1. Accounts tab: add your chequing, savings and credit cards with today’s balances.<br>2. Invest tab: add your stocks with shares, price and dividend.<br>3. Activity tab: log income, spending and card payments — recurring salary and bills post themselves there.<br>Your net worth and charts build from that.</p><button class="btn g" onclick="seedTest()">${dq=='seed'?'Tap again — load TEST data (replaces current)':'Load test data to explore'}</button></div>`;
 const n=nw(),m=ym(new Date()),inc=tot(m,'income'),exp=tot(m,'expense'),sr=inc>0?Math.round((inc-exp)/inc*100):null,ks=Object.keys(S.snap).sort(),bk=ks[Math.max(0,ks.length-31)],dl=ks.length>1?n-S.snap[bk]:null;
 const cats={};S.tx.filter(t=>t.k=='expense'&&t.d.slice(0,7)==m).forEach(t=>cats[t.c]=(cats[t.c]||0)+t.a);const cs=Object.entries(cats).sort((a,b)=>b[1]-a[1]),cm=cs.length?cs[0][1]:1;
 const cards=S.acc.filter(a=>a.t=='credit'&&a.lim>0),dv=sum(S.hold,h=>h.sh*h.div);
 return `<h1>Quick Budget</h1><div class="card hero"><small>NET WORTH</small><b>${f0(n)}</b><small>${dl==null?'Tracking starts today':(dl>=0?'▲ ':'▼ ')+f0(Math.abs(dl))+' since '+bk}</small>${line()}</div>`+
 `<div class="g2"><div class="card"><small>Assets</small><div class="k up">${f0(cash()+sav()+inv())}</div></div><div class="card"><small>Debt</small><div class="k dn">${f0(debt())}</div></div></div>`+
 `<h2>Where your money sits</h2><div class="card">${donut([{n:'Cash',v:cash()},{n:'Savings',v:sav()},{n:'Investments',v:inv()}])}</div>`+
 `<h2>This month</h2><div class="g3"><div class="card"><small>Income</small><div class="k up">${f0(inc)}</div></div><div class="card"><small>Spent</small><div class="k dn">${f0(exp)}</div></div><div class="card"><small>Saved</small><div class="k ${sr!=null&&sr<0?'dn':'up'}">${sr==null?'–':sr+'%'}</div></div></div>`+
 `<div class="card">${mbars()}</div>`+
 (cs.length?`<h2>Spending by category</h2><div class="card">${cs.map(([c,v],i)=>`<div class="catrow"><div class="row"><span class="sp" style="font-size:15.5px;color:var(--mu)">${esc(c)}</span><b style="font-size:16.5px">${f0(v)}</b></div><div class="bar"><i style="width:${v/cm*100}%;background:${PAL[i%8]}"></i></div></div>`).join('')}</div>`:'')+
 (cards.length?`<h2>Credit utilization</h2><div class="card">${cards.map(a=>{const u=a.b/a.lim*100;return `<div class="catrow"><div class="row"><span class="sp" style="font-size:15.5px;color:var(--mu)">${esc(a.n)}</span><b style="font-size:16.5px" class="${u>30?'dn':'up'}">${Math.round(u)}%</b></div><div class="bar"><i style="width:${Math.min(100,u)}%;background:${u>30?'var(--dn)':'var(--up)'}"></i></div></div>`}).join('')}<div style="font-size:13px;color:var(--mu)">Under 30% is the usual target.</div></div>`:'')+
 (dv>0?`<h2>Dividends</h2><div class="g2"><div class="card"><span style="font-size:14.5px;color:var(--mu)">Per year</span><div class="k">${f0(dv)}</div></div><div class="card"><span style="font-size:14.5px;color:var(--mu)">Per month</span><div class="k">${f0(dv/12)}</div></div></div>`:'')+annCard()+budgetCard(m)+insights()}
function accts(){
 const cs=cash(),sv=sav(),ow=debt();
 const pos=S.acc.filter(a=>(a.t=='cash'||a.t=='savings')&&a.b>0),pt=sum(pos,a=>a.b);
 const tiles=S.acc.filter(a=>['cash','savings','credit'].includes(a.t));
 const ico=t=>t=='cash'?'💵':t=='savings'?'🏦':'💳';
 let h=`<h1>Accounts</h1><div class="g3"><div class="card"><small>💵 Cash</small><div class="k">${f0(cs)}</div></div><div class="card"><small>🏦 Savings</small><div class="k">${f0(sv)}</div></div><div class="card"><small>💳 Owed</small><div class="k dn">${f0(ow)}</div></div></div>`;
 if(pt>0)h+=`<div class="card"><div class="split">${pos.map(a=>`<div style="width:${a.b/pt*100}%;background:${PAL[S.acc.indexOf(a)%8]}"></div>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:2px">${pos.map(a=>`<span style="display:flex;align-items:center;gap:7px;font-size:13.5px;min-width:0"><i style="width:10px;height:10px;border-radius:50%;flex:none;background:${PAL[S.acc.indexOf(a)%8]}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.n)}</span>${Math.round(a.b/pt*100)}%</span>`).join('')}</div></div>`;
 h+=`<div class="tiles">`+tiles.map(a=>{const i=S.acc.indexOf(a),u=a.lim?a.b/a.lim*100:0;return `<div class="tile" style="border-top-color:${PAL[i%8]}"><div class="row"><span class="ic">${ico(a.t)}</span><div class="sp"><div class="tn">${esc(a.n)}</div><div class="tt">${T[a.t]}</div></div><button class="x" onclick="delA(${a.id})">${dq=='a'+a.id?'Sure?':'×'}</button></div><input class="balin ${a.t=='credit'?'dn':''}" type="number" inputmode="decimal" value="${a.b}" onchange="setA(${a.id},this.value)">${a.lim?`<div class="bar"><i style="width:${Math.min(100,u)}%;background:${u>30?'var(--dn)':'var(--up)'}"></i></div><small>${Math.round(u)}% of ${f0(a.lim)}</small>`:''}</div>`}).join('')+`</div>`;
 const open=ui.addAcc||!tiles.length;
 h+=`<div class="card"><div class="addbar" onclick="ui.addAcc=!ui.addAcc;render()">＋ Add account</div>${open?`<div class="f" style="margin-top:8px"><input id="an" class="w" placeholder="Name (e.g. RBC Visa)"><select id="at"><option value="cash">Chequing / cash</option><option value="savings">Savings</option><option value="credit">Credit card</option></select><input id="ab" type="number" inputmode="decimal" placeholder="Balance (owed, for cards)"><input id="al" class="w" type="number" inputmode="decimal" placeholder="Credit limit (cards only, optional)"><button class="btn w" onclick="addA()">Add account</button></div>`:''}</div>`;
 return h}
function invest(){
 const v=inv(),c=sum(S.hold,h=>h.sh*h.cost),dv=sum(S.hold,h=>h.sh*h.div),g=v-c;
 const WRAP={tfsa:'TFSA',fhsa:'FHSA',rrsp:'RRSP',resp:'RESP',nonreg:'Non-registered'};
 let h=`<h1>Investing</h1><div class="card hero"><small>PORTFOLIO VALUE</small><b>${f0(v)}</b><small>${g>=0?'▲ ':'▼ '}${f0(Math.abs(g))} (${c>0?(g/c*100).toFixed(1):0}%) vs cost</small></div>`;
 h+=`<div class="card row"><small class="sp" id="mktstatus">${S.mkt.last?'Last updated '+esc(S.mkt.last):'Tap update for live delayed prices'} · Free market feed; saved prices stay offline.</small><button class="btn g" style="flex:none;padding:8px 14px" onclick="refreshMarket(true)">↻ Update</button></div>`;
 const ia=S.acc.filter(a=>['tfsa','fhsa','rrsp','resp','invest'].includes(a.t));
 h+=`<h2>Investment accounts</h2>`;
 if(ia.length)h+=`<div class="tiles">`+ia.map(a=>{const i=S.acc.indexOf(a);return `<div class="tile" style="border-top-color:${PAL[i%8]}"><div class="row"><span class="ic">📈</span><div class="sp"><div class="tn">${esc(a.n)}</div><div class="tt">${T[a.t]}</div></div><button class="x" onclick="delA(${a.id})">${dq=='a'+a.id?'Sure?':'×'}</button></div><input class="balin" type="number" inputmode="decimal" value="${a.b}" onchange="setA(${a.id},this.value)"></div>`}).join('')+`</div>`;

function parseShotText(text){
 const rows=[];const KNOWN=['MSTE','BIGY','HHIC','YTSL','NVDA','NOK','RY','TD','BNS','BMO','CM','ENB','CNR','SHOP','XEQT','VEQT','VFV','HXQ','ZSP'];
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 lines.forEach(ln=>{
   const money=[...ln.matchAll(/\$?\s?([\d]{1,3}(?:,[\d]{3})*(?:\.\d{2})|[\d]+\.\d{2})/g)].map(m=>num(m[1].replace(/,/g,'')));
   const acctM=ln.match(/(TFSA|FHSA|RRSP|RESP|Chequing|Checking|Savings|Cash|Non-registered)/i);
   const tkM=ln.toUpperCase().match(/\b([A-Z]{2,6})(\.TO)?\b/g);
   const tk=tkM?tkM.map(t=>t.replace('.TO','')).find(t=>KNOWN.includes(t)||S.hold.some(h=>h.tk.replace('.TO','')==t)):null;
   if(tk&&money.length){const val=money[money.length-1];const shM=ln.match(/([\d,]+\.\d{2,4}|[\d,]+)\s*(shares|share|units)?/i);let shares=money.length>1?money[0]:0;if(shares===val)shares=0;rows.push({type:'holding',tk:tk+(ln.toUpperCase().includes('.TO')||['MSTE','BIGY','HHIC','YTSL','RY','TD','BNS','BMO','CM','ENB','CNR','XEQT','VEQT','VFV','HXQ','ZSP'].includes(tk)?'.TO':''),shares,value:val,src:ln});return}
   if(acctM&&money.length){const map={TFSA:'tfsa',FHSA:'fhsa',RRSP:'rrsp',RESP:'savings',CHEQUING:'cash',CHECKING:'cash',SAVINGS:'savings',CASH:'cash','NON-REGISTERED':'invest'};rows.push({type:'account',name:acctM[1].toUpperCase()+' (from screenshot)',t:map[acctM[1].toUpperCase()]||'cash',b:money[money.length-1],src:ln});return}
   if(money.length&&ln.length>3&&!tk){let cat='Other';for(const[re,c]of RULES){if(re.test(ln.toLowerCase())){cat=c;break}}rows.push({type:'expense',a:money[money.length-1],n:ln.replace(/\$?[\d,]+\.\d{2}/g,'').trim().slice(0,40)||'Expense',c:cat,src:ln})}
 });
 return rows}
async function scanShot(inp){

 try{
  if(!window.Tesseract){await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
  const out=await Tesseract.recognize(f,'eng');const text=out.data.text;
  _ocrRows=parseShotText(text);
  if(!_ocrRows.length){st.innerHTML='<small>Could not find holdings, balances or expenses in that image. Try a clearer, straight-on screenshot — or add it manually. Nothing was changed.</small>';return}

 }catch(e){st.innerHTML='<small>Scanner could not run — check your connection for the first download, then try again. Nothing was changed.</small>'}}
